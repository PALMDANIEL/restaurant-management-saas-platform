<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Dani Mak</title>
<style>
  :root { color-scheme: light dark; --fond: #faf6e9; --texte: #2b2118; --doux: #7a6a58; --accent: #ea580c; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1b1510; --texte: #f3eadb; --doux: #b8a68f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte);
         font: 16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; padding: 24px; }
  main { max-width: 420px; text-align: center; }
  img { width: 132px; height: 132px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: var(--doux); margin: 0 0 24px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px;
           font: 600 15px/1 inherit; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <img src="../assets/icon.png" alt="">
  <h1>Pas de connexion à Internet</h1>
  <p>Dani Mak n'a pas pu joindre le serveur. Vérifiez la connexion (Wi-Fi ou données mobiles), puis réessayez.</p>
  <button id="r">Réessayer</button>
</main>
<script>
  const r = () => window.daniMak && window.daniMak.reessayer();
  document.getElementById("r").addEventListener("click", r);
  window.addEventListener("online", r);
</script>
</body>
</html>
